# Merge this service into the VPS compose file, alongside `backend`.
# Place the matching Photon release JAR at ./photon/photon.jar and the
# extracted Asia database at ./photon/photon_data before starting it.
services:
  photon:
    image: eclipse-temurin:21-jre
    working_dir: /photon
    command: ["java", "-Xmx8g", "-jar", "photon.jar", "serve"]
    volumes:
      - ./photon:/photon
    expose:
      - "2322"
    restart: unless-stopped
