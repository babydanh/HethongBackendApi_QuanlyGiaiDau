version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: qlgiaidau-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qlgiaidau-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      - redis

volumes:
  redis_data:
