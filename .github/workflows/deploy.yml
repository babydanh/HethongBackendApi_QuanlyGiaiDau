name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  schema-smoke:
    name: Verify football schema on clean PostgreSQL
    runs-on: ubuntu-latest
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: tournament_db
      DB_SSL: 'false'
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tournament_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d tournament_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile

      - name: Apply migrations to disposable database
        run: node run-prod-migration.js

      - name: Re-run migrations to verify idempotency
        run: node run-prod-migration.js

      - name: Verify football schema
        run: pnpm verify:football-schema

  # Job 1: Build Docker Image cho Backend trên GitHub và Push lên GHCR
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    needs: schema-smoke
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies and run tests
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile
          pnpm test --runInBand --passWithNoTests

      - name: Build and Push Docker Image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build \
            -t ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:latest \
            -t ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:${{ github.sha }} \
            .
          docker push ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:latest
          docker push ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:${{ github.sha }}

  # Job 2: Chỉ kéo bản build Backend về chạy trên VPS và chạy migration
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via native SSH
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p 36789 203.167.15.81 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -p 36789 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no root@203.167.15.81 bash -c "'
            set -euo pipefail
            cd /usr/local/lsws/sporto.asia
            sed -i \"s#giaidau\.vnvar\.com#sporto.asia#g\" .env

            app_api_key=\"\$(sed -n \"s/^APP_API_KEY=//p\" .env | head -n 1)\"
            if [ -z \"\${app_api_key}\" ]; then
              echo \"APP_API_KEY is missing from the VPS .env\"
              exit 1
            fi
            curl --fail --silent --show-error --max-time 15 \
              -H \"x-app-key: \${app_api_key}\" \
              \"https://sporto.asia/api/v1/categories\" > /dev/null

            echo \"$GITHUB_TOKEN\" | docker login ghcr.io -u $ACTOR --password-stdin
            docker pull ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:latest
            docker compose run --rm migrate node run-prod-migration.js --dry-run
            docker compose run --rm migrate
            docker compose up -d --force-recreate --no-deps backend

            for attempt in 1 2 3 4 5 6; do
              if curl --fail --silent --show-error --max-time 15 \
                -H \"x-app-key: \${app_api_key}\" \
                \"https://sporto.asia/api/v1/categories\" > /dev/null; then
                echo \"API smoke check passed on attempt \${attempt}\"
                break
              fi
              if [ \"\${attempt}\" -eq 6 ]; then
                echo \"API smoke check failed after restart\"
                docker compose logs --tail=120 backend
                exit 1
              fi
              sleep 5
            done

            wards_probe=\"\$(curl --fail --silent --show-error --max-time 15 \
              -H \"x-app-key: \${app_api_key}\" \
              \"https://sporto.asia/api/v1/regions/wards?provinceCode=30\")\" || {
              echo \"Address v2 smoke check failed: /regions/wards rejected provinceCode\"
              docker compose logs --tail=120 backend
              exit 1
            }
            if ! printf '%s' \"\${wards_probe}\" | grep -q '\"data\"'; then
              echo \"Address v2 smoke check failed: unexpected response shape\"
              exit 1
            fi

            docker image prune -f
          '"
