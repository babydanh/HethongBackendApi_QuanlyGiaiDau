name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build Docker Image cho Backend trên GitHub và Push lên GHCR
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies and run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm test --runInBand --passWithNoTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:latest,ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: Chỉ kéo bản build Backend về chạy trên VPS và chạy migration
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 203.167.15.81
          port: 36789
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            # 1. Đi tới thư mục chứa docker-compose.yml trên VPS
            cd /usr/local/lsws/sporto.asia

            # Keep the VPS runtime environment aligned with the public domain.
            # docker-compose reads this persisted .env file, not the repository's
            # .env.production file baked into the image.
            sed -i 's#giaidau\.vnvar\.com#sporto.asia#g' .env

            # 2. Đăng nhập GHCR trên VPS
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 3. Pull image backend mới nhất từ Registry về
            docker pull ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:latest

            # 4. Chạy migration cơ sở dữ liệu
            docker compose run --rm migrate

            # 5. Khởi động lại service backend với image mới
            docker compose up -d --force-recreate --no-deps backend

            # 5b. Smoke check public API after migration/restart. Fail the deploy
            # if the container is running but the API cannot serve a basic read.
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 15 "https://sporto.asia/api/v1/categories?limit=1" >/dev/null; then
                echo "Backend smoke check passed"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Backend smoke check failed"
                docker compose logs --tail=80 backend
                exit 1
              fi
              sleep 10
            done

            # 6. Dọn dẹp các Docker Image cũ
            docker image prune -f
