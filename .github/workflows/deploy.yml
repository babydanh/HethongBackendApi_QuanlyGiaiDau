name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Job 1: Build Docker Image cho Backend trên GitHub và Push lên GHCR
  build-and-push:
    name: Build & Push Backend Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Job 2: Chỉ kéo bản build Backend về chạy trên VPS và chạy migration
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 203.167.15.81
          port: 36789
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            # 1. Đi tới thư mục chứa code dự án trên VPS
            cd /usr/local/lsws/giaidau.vnvar.com

            # 2. Pull file docker-compose.yml mới nhất
            git pull origin main

            # 3. Đăng nhập vào GHCR trên VPS để tải Image private
            echo "${{ secrets.GHCR_PAT }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

            # 4. Pull image backend mới từ Registry về
            docker pull ghcr.io/babydanh/hethongbackendapi_quanlygiaidau:latest

            # 5. Chạy migration cơ sở dữ liệu
            docker compose run --rm migrate

            # 6. Khởi động lại service backend với image mới (không ảnh hưởng dịch vụ khác)
            docker compose up -d --no-deps backend

            # 7. Dọn dẹp các Docker Image cũ không dùng
            docker image prune -f
